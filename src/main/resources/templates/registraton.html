<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <h2 class="mt-5">Регистрация</h2>
    <form id="registrationForm" method="POST" action="/auth/signup">
        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="email">Электронная почта</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div id="error-message" class="text-danger" style="display: none;"></div> <!-- Место для сообщений об ошибках -->
        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
    </form>
    <p class="mt-3">Уже есть аккаунт? <a href="/auth/signin">Войти</a></p>
</div>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    // Пример обработки ошибок (можно расширить)
    $(document).ready(function() {
        $('#registrationForm').on('submit', function(event) {
            event.preventDefault(); // Предотвращаем стандартное поведение формы
            const username = $('#username').val();
            const email = $('#email').val();
            const password = $('#password').val();

            $.ajax({
                type: 'POST',
                url: '/auth/signup',
                contentType: 'application/json',
                data: JSON.stringify({ username: username, email: email, password: password }),
                success: function(response) {
                    // Успешная регистрация, перенаправление или другое действие
                    window.location.href = '/auth/signin'; // Замените на нужный URL
                },
                error: function(xhr) {
                    // Обработка ошибок
                    $('#error-message').text(xhr.responseText).show();
                }
            });
        });
    });
</script>
</body>
</html>
